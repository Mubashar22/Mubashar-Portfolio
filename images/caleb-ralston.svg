<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <defs>
  <symbol id="logo-ralston" viewBox="0 0 164 36"><image href="data:image/png;base64," width="164" height="36"/></symbol>
  
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F6F5"/>
      <stop offset="100%" stop-color="#EAEEEC"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6F4"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7DBDE"/>
      <stop offset="100%" stop-color="#A6ACB2"/>
    </linearGradient>
    <clipPath id="clipLaptop"><rect x="106" y="56" width="568" height="340" rx="6"/></clipPath>
    <clipPath id="clipTablet"><rect x="534" y="264" width="222" height="278" rx="10"/></clipPath>
    <clipPath id="clipPhone"><rect x="740" y="310" width="130" height="260" rx="20"/></clipPath>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>

  <ellipse cx="390" cy="440" rx="260" ry="18" fill="#1F4740" opacity=".08"/>
  <ellipse cx="645" cy="558" rx="120" ry="14" fill="#1F4740" opacity=".1"/>
  <ellipse cx="805" cy="586" rx="75" ry="10" fill="#C0392B" opacity=".12"/>

  <!-- ===== LAPTOP ===== -->
  <rect x="90" y="40" width="600" height="372" rx="20" fill="#1B1B1D"/>
  <path d="M90,412 L690,412 L736,432 L44,432 Z" fill="url(#base)"/>
  <rect x="90" y="409" width="600" height="4" fill="#000" opacity=".25"/>
  <rect x="335" y="418" width="60" height="6" rx="3" fill="#000" opacity=".2"/>

  <g clip-path="url(#clipLaptop)">
