    <rect x="106" y="98" width="568" height="150" fill="url(#hero)"/>
    <text x="146" y="150" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#171717">We help <tspan fill="#1F4740">bold</tspan></text>
    <text x="146" y="178" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#171717"><tspan fill="#1F4740">entrepreneurs</tspan> scale</text>
    <text x="146" y="206" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#171717">brands that convert.</text>
