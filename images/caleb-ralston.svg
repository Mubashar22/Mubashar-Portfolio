    <g font-family="Georgia, serif">
      <rect x="126" y="266" width="156" height="110" rx="4" fill="#1F4740"/>
      <rect x="126" y="266" width="156" height="70" fill="#173832" opacity=".6"/>
      <rect x="146" y="348" width="110" height="8" rx="4" fill="#FFFFFF" opacity=".9"/>

      <rect x="298" y="266" width="156" height="110" rx="4" fill="#1F4740"/>
      <rect x="298" y="266" width="156" height="70" fill="#173832" opacity=".6"/>
      <rect x="318" y="348" width="110" height="8" rx="4" fill="#FFFFFF" opacity=".9"/>

      <rect x="470" y="266" width="156" height="110" rx="4" fill="#C0392B"/>
      <text x="548" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#FFFFFF">RALSTON</text>
      <text x="548" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#FFFFFF" opacity=".85">SELECT</text>
