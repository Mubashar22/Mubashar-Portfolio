    <text x="548" y="316" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#171717">We help <tspan fill="#1F4740">bold</tspan></text>
    <text x="548" y="334" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#171717">brands convert.</text>
    <rect x="548" y="350" width="110" height="20" rx="2" fill="#1F4740"/>
    <text x="603" y="364" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" font-weight="700" fill="#FFFFFF">Partnership</text>

    <rect x="548" y="392" width="194" height="56" rx="4" fill="#1F4740"/>
    <rect x="560" y="414" width="120" height="7" rx="3.5" fill="#FFFFFF" opacity=".85"/>

    <rect x="548" y="456" width="194" height="56" rx="4" fill="#C0392B"/>
    <text x="645" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#FFFFFF">SELECT</text>
  </g>

  <!-- ===== PHONE ===== -->
  <rect x="730" y="300" width="150" height="280" rx="32" fill="#1B1B1D"/>
  <rect x="781" y="300" width="44" height="14" rx="7" fill="#1B1B1D"/>
  <rect x="785" y="566" width="40" height="4" rx="2" fill="#4A4A4D"/>
  <g clip-path="url(#clipPhone)">
    <rect x="740" y="310" width="130" height="260" fill="#FFFFFF"/>
